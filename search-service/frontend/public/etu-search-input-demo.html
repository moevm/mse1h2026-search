<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ETU Search Input</title>
    <script src="/etu-search-input.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
        color: #202532;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }

      .search-box {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 10px;
        border: 1px solid #d9dee8;
        border-radius: 6px;
        background: #fff;
      }

      .search-form {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      etu-search-input {
        flex: 1 1 auto;
        min-width: 0;
        --etu-search-min-height: 38px;
        --etu-search-radius: 4px;
        --etu-search-gap: 6px;
        --etu-search-border: #d9dee8;
        --etu-search-accent: #003087;
        --etu-search-focus-ring: rgba(0, 48, 135, 0.1);
        --etu-search-muted: #6b7280;
        --etu-search-hover-bg: #f1f5fb;
        --etu-search-shadow: 0 8px 18px rgba(24, 32, 48, 0.12);
      }

      etu-search-input::part(root) {
        align-items: flex-start;
      }

      etu-search-input::part(field) {
        order: 1;
        min-width: 280px;
      }

      etu-search-input::part(languages) {
        order: 2;
      }

      etu-search-input::part(mode-select) {
        order: 3;
        width: 150px;
      }

      etu-search-input::part(language) {
        min-width: 38px;
      }

      .submit {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 4px;
        background: #003087;
        color: #fff;
        cursor: pointer;
      }

      .submit svg {
        width: 18px;
        height: 18px;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
          background: #fff;
        }

        .search-box {
          padding: 8px;
          border-radius: 4px;
        }

        .search-form {
          gap: 6px;
        }

        etu-search-input::part(field),
        etu-search-input::part(mode-select) {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="search-box">
      <form class="search-form" action="/rezultaty-poiska" method="GET">
        <etu-search-input
          name="search"
          query-param="q"
          api-base=""
          results-url="/rezultaty-poiska"
          submit-mode="navigate"
          languages="RU,EN,DE,SP,VN,CN,AR,PT,FR"
          modes='[
            {"id":"site","label":"Сайт","suggestPath":"/api/suggest","resultsUrl":"/rezultaty-poiska"}
          ]'
        ></etu-search-input>
        <button class="submit" type="submit" aria-label="Найти">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4.4-4.4"></path>
          </svg>
        </button>
      </form>
    </div>
  </body>
</html>
