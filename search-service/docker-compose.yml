services:
  click-db:
    image: postgres:17-alpine
    container_name: search_click_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${CLICK_DB_USER:-click_user}
      POSTGRES_PASSWORD: ${CLICK_DB_PASSWORD:-click_password}
      POSTGRES_DB: ${CLICK_DB_NAME:-clicks}
    volumes:
      - click_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLICK_DB_USER:-click_user} -d ${CLICK_DB_NAME:-clicks}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - search_network

  meilisearch:
    image: getmeili/meilisearch:v1.42.1
    container_name: search_meili
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - search_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: search_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      click-db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - search_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: search_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "6767:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - search_network

networks:
  search_network:
    driver: bridge

volumes:
  meili_data:
  click_db_data:
